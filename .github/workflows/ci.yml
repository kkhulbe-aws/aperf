name: CI

on:
  pull_request:
    branches:
      - "**"
  workflow_call: # Needed to make this a reusable workflow for releasing artifacts https://docs.github.com/en/actions/using-workflows/reusing-workflows
  workflow_dispatch: # To allow starting the workflow manually in the web ui

permissions:
  contents: read

jobs:
  CI:
    timeout-minutes: 30 
    strategy:
      matrix:
        image: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on:
      - ${{matrix.image}}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@446798f8213ac2e75931c1b0769676d927801858 # v2.10.3
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      # Prepare build dependencies
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@47f4dd75f027bd6cfe06f3dc15ddfcb07acc7e4e # 1.74.0
        with:
          components: rustfmt, clippy
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 16.16.0
      - name: Apt update
        run: sudo apt update
      - name: Install gcc
        run: sudo apt install -y build-essential
      - name: Install Common Hotline libraries
        run: |
          sudo apt install -y \
            libdw-dev \
            libelf-dev \
            libcapstone-dev \
            zlib1g-dev \
            liblzma-dev \
            libbz2-dev \
            libzstd-dev \
            libdwarf-dev \
            linux-headers-$(uname -r) \
            libc6-dev \
            libstdc++-11-dev \
            libgcc-11-dev
      - name: Install Platform Dependent Libraries
        run: |
          case $(arch) in
            aarch64)
              sudo apt-get update
              sudo apt-get install -y \
                  gcc-aarch64-linux-gnu \
                  g++-aarch64-linux-gnu
              ;;
            x86_64)
              sudo apt-get update
              sudo apt-get install -y \
                build-essential \
                libc6 \
                gcc \
                g++ \
                linux-libc-dev \
                libdw1 \
                gcc-multilib
              ;;
            *)
              echo "Unsupported architecture: $(arch)"
              exit 1
              ;;
          esac

      # Tests and static analysis
      - name: Set perf_event_paranoid to 0
        run: echo 0 | sudo tee /proc/sys/kernel/perf_event_paranoid
      - name: Run tests
        run: cargo test --verbose -- --nocapture --color always
      - name: Run clippy
        run: cargo clippy --all-targets --all-features
      - name: Run rustfmt
        run: cargo fmt --all -- --check

      # Build and upload release artifacts
      - name: Build release artifacts
        run: |
          rustup target add $(arch)-unknown-linux-gnu
          case $(arch) in
            aarch64)
              echo "Building for aarch64 architecture"
              cargo build --release --target aarch64-unknown-linux-gnu
              ;;
            x86_64)
              echo "Building for x86_64 architecture"
              export LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/lib/gcc/x86_64-linux-gnu/11:$LIBRARY_PATH
              cargo build --no-default-features --release --target $(arch)-unknown-linux-gnu

              echo "Building for x86_64 architecture"
              ;;
            *)
              echo "Unsupported architecture: $(arch)"
              exit 1
              ;;
          esac

      - name: Link status
        run: |
          set +e
          ldd_output=$(ldd target/$(arch)-unknown-linux-gnu/release/aperf 2>&1)
          set -e

          if echo "$ldd_output" | grep -q "not a dynamic executable"; then
              echo "Binary is statically linked."
          else
              echo "Error: binary is not statically linked." >&2
              exit 1
          fi

      - name: Archive release artifacts
        run: tar -zcvf artifacts.tar.gz -C target/$(arch)-unknown-linux-gnu/release aperf
      - name: Upload x86_64 release artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.image == 'ubuntu-22.04' }}
        with:
          name: x86_64-release-artifacts
          path: artifacts.tar.gz
      - name: Upload aarch64 release artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.image == 'ubuntu-22.04-arm' }}
        with:
          name: aarch64-release-artifacts
          path: artifacts.tar.gz
